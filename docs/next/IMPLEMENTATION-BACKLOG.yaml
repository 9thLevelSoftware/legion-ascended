schema_version: 1
program: LEGION-NEXT
decision: CONDITIONAL GO
source_decision: docs/next/PHASE-00-DECISION.md
items:
  - id: P01-B001
    phase: 1
    title: Create TypeScript workspace and package boundaries
    milestone: MVP-critical
    owner: platform-owner
    depends_on:
      - P00-GO-004
    maps_to:
      - docs/next/PHASE-00-DECISION.md
      - C:/Users/dasbl/Documents/legion/docs/rebuild/01-phase-typescript-workspace-and-protocol-core.md
    acceptance:
      - Workspace installs on Node 24+.
      - Package boundaries separate protocol, core, runtime contracts, CLI compatibility, and test fixtures.
      - No standalone app/dashboard package is introduced.
    verification:
      - npm install or equivalent package-manager install
      - package file-list baseline check
  - id: P01-B002
    phase: 1
    title: Define workflow protocol schemas
    milestone: MVP-critical
    owner: protocol-owner
    depends_on:
      - P01-B001
      - P00-GO-001
    maps_to:
      - docs/next/adr/ADR-003-state-ownership.md
      - docs/next/adr/ADR-005-events-idempotency.md
    acceptance:
      - Schemas cover Project, Change, TaskContract, TaskRun, Event, Evidence, Review, Approval, WorkerBundle, RuntimeDriver.
      - Schema names and fields describe workflow orchestration, not chat-app state.
      - Versioning and migration metadata are explicit.
    verification:
      - schema round-trip tests
      - fixture validation tests
  - id: P01-B003
    phase: 1
    title: Define provider-neutral RuntimeDriver and local fake driver contracts
    milestone: MVP-critical
    owner: runtime-owner
    depends_on:
      - P01-B002
      - P00-GO-003
      - P00-GO-006
    maps_to:
      - docs/next/adr/ADR-004-runtime-driver.md
      - docs/next/spikes/EVE-COMPATIBILITY.md
    acceptance:
      - RuntimeDriver contract supports start, resume, cancel, inspect, stream, approve, and artifact.
      - Local fake driver can produce deterministic run events for tests.
      - Contract imports no Eve or host CLI implementation types.
    verification:
      - runtime contract tests
      - import-boundary scan
  - id: P01-B004
    phase: 1
    title: Define Event and idempotency fixtures
    milestone: MVP-critical
    owner: protocol-owner
    depends_on:
      - P01-B002
    maps_to:
      - docs/next/adr/ADR-005-events-idempotency.md
    acceptance:
      - Event envelope has stable ID, type, version, stream, actor, causation, correlation, timestamp, payload, and schema version.
      - Idempotency-key examples cover Git, PR/comment, approval, runtime delivery, and local artifact writes.
      - Replay and re-execution are separate in tests and docs.
    verification:
      - deterministic event fixture tests
  - id: P01-B005
    phase: 1
    title: Preserve v8 workflow package surface during workspace introduction
    milestone: MVP-critical
    owner: compatibility-owner
    depends_on:
      - P01-B001
      - P00-GO-002
    maps_to:
      - docs/next/baseline/V8-WORKFLOW-COMPATIBILITY-BASELINE.md
    acceptance:
      - Existing v8 commands, skills, adapters, agents, and installer paths remain packaged.
      - New v9 code is additive and behind next/v9 package boundaries.
    verification:
      - npm pack dry-run comparison against P00-T06 evidence
      - v8 validation scripts still pass where applicable
  - id: P02-B001
    phase: 2
    title: Implement Git-tracked artifact model and shadow migration
    milestone: MVP-critical
    owner: migration-owner
    depends_on:
      - P01-B002
    maps_to:
      - docs/next/adr/ADR-003-state-ownership.md
    acceptance:
      - `.planning/` imports are backed up and treated as historical input.
      - `.legion/project` owns committed intent without dual-write sync.
    verification:
      - migration fixture tests
      - rollback tests
  - id: P03-B001
    phase: 3
    title: Implement transactional workflow board on node:sqlite
    milestone: MVP-critical
    owner: storage-owner
    depends_on:
      - P01-B004
      - P02-B001
      - P00-GO-005
    maps_to:
      - docs/next/adr/ADR-008-local-store-selection.md
    acceptance:
      - Board supports append events, atomic claims, heartbeats, reclaim, migration, backup, and outbox.
      - Linux, macOS, and Windows tests cover claim/recovery/storage faults.
    verification:
      - board integration tests across OS matrix
  - id: P04-B001
    phase: 4
    title: Replace persona injection with functional worker bundles
    milestone: MVP-critical
    owner: worker-bundle-owner
    depends_on:
      - P01-B002
      - P02-B001
    maps_to:
      - docs/next/adr/ADR-002-functional-workers.md
      - docs/next/reviews/PHASE-00-FINDINGS.yaml
    acceptance:
      - Legacy persona IDs map to functional roles and domain packs.
      - No default runtime path injects biographies, tone, or personality prose.
    verification:
      - bundle manifest validation
      - prompt-content scan
  - id: P05-B001
    phase: 5
    title: Implement and certify runtime-eve adapter
    milestone: beta-critical
    owner: runtime-owner
    depends_on:
      - P01-B003
      - P03-B001
      - P04-B001
    maps_to:
      - docs/next/spikes/EVE-COMPATIBILITY.md
      - docs/next/adr/ADR-004-runtime-driver.md
    acceptance:
      - Public-contract start/resume/cancel/inspect/stream, approval, artifact, subagent, sandbox, and eval tests pass.
      - Fallback to runtime-local or runtime-legacy-cli is documented and tested.
    verification:
      - pinned Eve compatibility suite
  - id: P13-B001
    phase: 13
    title: Run release-grade workflow evals and v8/v9 A/B proof
    milestone: GA-critical
    owner: eval-owner
    depends_on:
      - P05-B001
      - P08-B001
      - P12-B001
    maps_to:
      - docs/next/baseline/V8-WORKFLOW-COMPATIBILITY-BASELINE.md
      - evals/baseline/manifest.yaml
    acceptance:
      - v8 and v9 are compared on sealed workflow scenarios before GA quality claims.
      - Cost, duration, intervention, recovery, duplicate-work, and defect metrics are recorded where exposed.
    verification:
      - live workflow eval report
  - id: P14-B001
    phase: 14
    title: Realign CLI to workflow-first Legion UX
    milestone: GA-critical
    owner: compatibility-owner
    depends_on:
      - P13-B001
    maps_to:
      - docs/next/adr/ADR-009-workflow-first-cli.md
      - docs/next/baseline/V8-WORKFLOW-COMPATIBILITY-BASELINE.md
    acceptance:
      - Canonical root help leads with workflow commands such as legion start, legion plan, legion build, and legion review.
      - Existing typed service commands remain reachable under legion dev.
      - Worker bundle authoring is documented as a dev extension workflow, not normal usage.
      - CLI e2e tests prove top-level workflow command parity and hidden next compatibility.
    verification:
      - node --test tests/workflow-command-contract.test.mjs
      - node --test tests/cli-workflow-ux.test.mjs
      - pnpm run validate:next
  # Phase 16 retires .planning/ from the installed command surface. Phase 15 is
  # skipped: no backlog item claims it, but the control-artifacts branch used
  # the name informally, and reusing it would make two different things share a
  # number.
  #
  # commands/start.md and commands/status.md are already converted and are the
  # worked examples. The remaining sixteen are not one kind of work — see
  # P16-B001's conversion contract for the three classes and why thin-wrapping
  # the orchestration commands would delete capability silently.
  - id: P16-B001
    phase: 16
    title: Ratchet the command surface off .planning/
    milestone: GA-critical
    owner: compatibility-owner
    depends_on:
      - P14-B001
    maps_to:
      - commands/start.md
      - commands/status.md
    acceptance:
      - A test enumerates every commands/*.md and fails when one reads .planning/ outside a declared allowlist.
      - The allowlist is seeded with the sixteen unconverted commands and may only ever be shortened.
      - A conversion contract records, per class, what the CLI owns and what the host keeps.
      - The contract states that a command whose host-only behaviour is not inventoried before editing must not be converted.
    verification:
      - node --test tests/command-surface.test.mjs
      - pnpm run validate:next
  - id: P16-B002
    phase: 16
    title: Convert validate and map to CLI renderers
    milestone: GA-critical
    owner: compatibility-owner
    depends_on:
      - P16-B001
    maps_to:
      - commands/validate.md
      - commands/map.md
    acceptance:
      - Each command renders legion validate --json or legion map --json and derives no state itself.
      - Neither file reads .planning/, and both are removed from the allowlist.
      - Any state the wrapper needs that the CLI does not expose is added to the CLI first, with tests.
    verification:
      - node --test tests/command-surface.test.mjs
      - node --test tests/legacy/installer-smoke.test.cjs
      - pnpm run validate:next
  - id: P16-B003
    phase: 16
    title: Convert learn, retro, and milestone to CLI renderers
    milestone: GA-critical
    owner: compatibility-owner
    depends_on:
      - P16-B001
    maps_to:
      - commands/learn.md
      - commands/retro.md
      - commands/milestone.md
    acceptance:
      - Each command renders its legion verb's JSON payload and records nothing to .planning/.
      - Guidance artifacts continue to be written by the CLI, not by the host.
      - All three are removed from the allowlist.
    verification:
      - node --test tests/command-surface.test.mjs
      - node --test tests/workflow-guidance.test.mjs
      - pnpm run validate:next
  - id: P16-B004
    phase: 16
    title: Convert explore and advise to CLI renderers
    milestone: GA-critical
    owner: compatibility-owner
    depends_on:
      - P16-B001
    maps_to:
      - commands/explore.md
      - commands/advise.md
    acceptance:
      - Both commands render their legion verb's JSON payload and write no artifacts directly.
      - explore continues to produce an exploration typed as exploratory that start can seed proposals from.
      - Both are removed from the allowlist.
    verification:
      - node --test tests/command-surface.test.mjs
      - node --test tests/workflow-guidance.test.mjs
      - pnpm run validate:next
  - id: P16-B005
    phase: 16
    title: Split plan, quick, and polish across the CLI and host boundary
    milestone: GA-critical
    owner: compatibility-owner
    depends_on:
      - P16-B001
    maps_to:
      - commands/plan.md
      - commands/quick.md
      - commands/polish.md
    acceptance:
      - Host-only behaviour is inventoried and recorded before any file is edited.
      - The CLI owns the taskgraph, the risk classification, and the decision that planning is complete.
      - The host retains only agent selection and rendering, and reaches state through the CLI's typed artifacts.
      - No capability present before the split is absent after it, or its removal is recorded as deliberate.
    verification:
      - node --test tests/command-surface.test.mjs
      - node --test tests/workflow-command-contract.test.mjs
      - pnpm run validate:next
  - id: P16-B006
    phase: 16
    title: Split build across the CLI and host boundary
    milestone: GA-critical
    owner: compatibility-owner
    depends_on:
      - P16-B005
    maps_to:
      - commands/build.md
    acceptance:
      - The fourteen agent-dispatch sites in commands/build.md are inventoried before editing, each classified as host-only or CLI-owned.
      - The CLI owns verification, diff reconciliation, and the task verdict; the host owns wave dispatch only.
      - The wave executor survives the conversion, or its removal is recorded with a replacement.
    verification:
      - node --test tests/command-surface.test.mjs
      - node --test tests/build-diff-reconciliation.test.mjs
      - node scripts/dogfood-workflow.mjs --executor fake
      - pnpm run validate:next
  - id: P16-B007
    phase: 16
    title: Split review across the CLI and host boundary
    milestone: GA-critical
    owner: compatibility-owner
    depends_on:
      - P16-B005
    maps_to:
      - commands/review.md
    acceptance:
      - The sixteen agent-dispatch sites in commands/review.md are inventoried before editing, each classified as host-only or CLI-owned.
      - The CLI owns the verification report, the gate set, and human acceptance; the host owns the review panel.
      - legion review exposes what a panel needs before commands/review.md is thinned, not after.
      - The multi-agent review panel survives the conversion, or its removal is recorded with a replacement.
    verification:
      - node --test tests/command-surface.test.mjs
      - node --test tests/workflow-command-contract.test.mjs
      - pnpm run validate:next
  - id: P16-B008
    phase: 16
    title: Split ship, and rename board onto the council verb
    milestone: GA-critical
    owner: compatibility-owner
    depends_on:
      - P16-B005
    maps_to:
      - commands/ship.md
      - commands/board.md
    acceptance:
      - ship renders the derived gate set and never asserts readiness the CLI did not derive.
      - The user-facing /legion:board name is preserved while the command drives legion council.
      - Neither file reads .planning/, and both are removed from the allowlist.
    verification:
      - node --test tests/command-surface.test.mjs
      - node --test tests/ship-traceability.test.mjs
      - pnpm run validate:next
  - id: P16-B009
    phase: 16
    title: Decide where agent and portfolio belong
    milestone: GA-critical
    owner: compatibility-owner
    depends_on:
      - P16-B001
    maps_to:
      - commands/agent.md
      - commands/portfolio.md
    acceptance:
      - A recorded decision states, for each command, whether it gains a CLI verb or stays host-owned.
      - The decision addresses that portfolio is cross-repo while every CLI verb is scoped by --repository-root, so a repo-scoped CLI may have no valid home for it.
      - The decision addresses that agent authors personality files rather than workflow state, and so may not be a workflow verb at all.
      - Whatever is decided, neither file reads .planning/ afterwards, and both leave the allowlist.
    verification:
      - node --test tests/command-surface.test.mjs
      - pnpm run validate:next
