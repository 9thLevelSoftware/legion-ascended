  # Phase 16 retires .planning/ from the installed command surface. Phase 15 is
  # skipped: no backlog item claims it, but the control-artifacts branch used
  # the name informally, and reusing it would make two different things share a
  # number.
  #
  # commands/start.md and commands/status.md are already converted and are the
  # worked examples. The remaining sixteen are not one kind of work — see
  # P16-B001's conversion contract for the three classes and why thin-wrapping
  # the orchestration commands would delete capability silently.
  #
  # The first pass of this plan classified from one-line help text and got four
  # wrong: advise, ship, board, and explore each own orchestration no CLI verb
  # performs. Review caught the first three. The fourth, and three false claims
  # about what the verbs do, were caught only once B001's inventory was built
  # from the implementations.
  #
  # The class assignments below are no longer the record. B001 delivered
  # docs/next/command-capability-inventory.json, which is checked against the
  # code by scripts/scan-command-surface.mjs and is authoritative where the two
  # disagree. docs/next/COMMAND-CONVERSION-CONTRACT.md states the procedure.
  - id: P16-B001
    phase: 16
    title: Ratchet the command surface off .planning/
    milestone: GA-critical
    owner: compatibility-owner
    depends_on:
      - P14-B001
    maps_to:
      - commands/start.md
      - commands/status.md
    acceptance:
      - A test enumerates every commands/*.md and fails when one reads .planning/ outside a declared allowlist.
      - The allowlist is seeded with the sixteen unconverted commands and may only ever be shortened.
      - A conversion contract records, per class, what the CLI owns and what the host keeps.
      - The contract states that a command whose host-only behaviour is not inventoried before editing must not be converted.
      - >-
        A per-command capability inventory records what the markdown does and what the CLI verb
        actually does, and is completed before the command is assigned a class. Verb existence is
        not evidence of parity: explore and council resolve to one shared implementation
        (runExecutorBackedGuidance in packages/cli/src/commands/workflow/contextual.ts), as do
        quick and polish (createTypedAdHocWorkflow), so those four verb names describe two
        behaviours between them.
      - >-
        The inventory's claims are checked against the code rather than read. Every host-only
        capability carries an anchor that must still appear in the command file, every verb claim
        names a handler symbol that must still resolve, and executorBacked is recomputed from the
        handler body instead of being asserted.
      - >-
        A command on the allowlist with no inventory entry fails the ratchet, so a class cannot be
        assigned to a command nobody has looked at. That is the check the first pass lacked: it
        classified from one-line help text and put advise, ship, board, and explore in classes
        that would have deleted an advisor selection, a publishing workflow, a deliberating panel,
        and the design conversation exploration exists to hold.
    verification:
      - node --test tests/command-surface.test.mjs
      - node scripts/scan-command-surface.mjs
      - pnpm run validate:next
  # Found while inventorying for B002 and B003, and true of the CLI today rather
  # than of the conversion. Kept separate because they are defects a user hits
  # now, not work the conversion creates.
  - id: P16-B012
    phase: 16
    title: Fix three verb defects the capability inventory surfaced
    milestone: GA-critical
    owner: compatibility-owner
    depends_on:
      - P16-B001
    maps_to:
      - packages/cli/src/commands/workflow/contextual.ts
    acceptance:
      - >-
        legion map --query <text> --scope <path> no longer silently ignores the scope. mapQuery is
        called without it and the mode-conflict guard does not catch it, because scope is not a
        mode, so the query runs unscoped and reports success. Either scope it or reject the
        combination.
      - >-
        legion milestone with no mode no longer mutates. Status is the implicit default and rewrites
        milestones.json, writes a fresh milestones.md, and appends a guidance run on every
        invocation, so reading state changes it and pollutes the run history.
      - >-
        legion retro --phase and --milestone either select evidence or are rejected. They currently
        reach only a slug, a run record, and a prompt topic string, so a scoped retrospective
        silently produces an unscoped one.
      - Each fix carries a test that fails against the current behaviour.
    verification:
      - node --test tests/workflow-guidance.test.mjs
      - pnpm run validate:next
  # An adversarial sweep run before writing B002, hunting siblings of the three
  # defects B012 fixed rather than waiting for review to find them one at a time.
  # It returned 26 confirmed instances. The parse hazard below was fixed
  # immediately because it destroys data; the rest are recorded here because
  # they are live defects with no owner, and an unowned defect list is the thing
  # this phase exists to stop producing.
  - id: P16-B013
    phase: 16
    title: Reject advertised options the handler never reads
    milestone: GA-critical
    owner: compatibility-owner
    depends_on:
      - P16-B012
    maps_to:
      - packages/cli/src/runtime.ts
    acceptance:
      - >-
        parseCliArgs accepts any option, so a flag no handler reads is silently ignored rather than
        refused. Every defect below is that one mechanism. Each command declares the options it
        reads and the runtime refuses the rest, which converts the whole class into a usage error at
        the boundary instead of a wrong answer at the end.
      - >-
        Three of these change which artifact is acted on, and are the reason this is GA-critical
        rather than tidy-up. legion review --phase N reviews and can accept a change other than the
        one named; legion build --phase N builds the latest taskgraph rather than phase N; legion
        start --session <id> --from-exploration <runId> returns before the exploration is read and
        discards it.
      - >-
        legion review --accept --reject-reason "<text>" accepts and discards the rejection: the
        accept branch returns before reject-reason is read. Two contradictory instructions must not
        resolve silently in favour of the destructive one.
      - >-
        The remaining unread options are either implemented or removed from the help text that
        advertises them, and the choice is recorded per option: ship --canary; plan --auto,
        --skip-board, --skip-security and --auto-refine (read only to be echoed back into the
        payload); polish --dry-run, --phase and --scope; retro --dry-run; validate --fix and --ci;
        learn --recall, --list and --prune; review --max-cycles outside --auto.
      - legion explore --entry <anything> validates against its closed set instead of silently recording raw-idea.
    verification:
      - node --test tests/cli-option-parsing.test.mjs
      - node --test tests/cli-workflow-ux.test.mjs
      - pnpm run validate:next
  - id: P16-B014
    phase: 16
    title: Stop guidance reads from writing run records
    milestone: GA-critical
    owner: compatibility-owner
    depends_on:
      - P16-B012
    maps_to:
      - packages/cli/src/commands/workflow/contextual.ts
      - packages/cli/src/workflow/codebase-map.ts
    acceptance:
      - >-
        legion map --check and legion map --query write a guidance run each time they are called,
        though both only inspect an existing map. This is the milestone-status defect B012 fixed,
        in the two neighbours the fix did not reach.
      - >-
        It is worse than clutter here. getLatestCodebaseMap finds the current map by scanning only
        the newest 20 guidance runs of workflow "map", so twenty checks or queries evict the refresh
        that produced the map, and the CLI then reports no map exists. Reads currently destroy the
        ability to find what they read.
      - >-
        mapCheck claims its run directory before the work that can refuse, so an invalid --scope
        leaves an empty run directory behind after returning a usage error.
      - Each fix carries a test that fails against the current behaviour.
    verification:
      - node --test tests/verb-defects.test.mjs
      - node --test tests/workflow-guidance.test.mjs
      - pnpm run validate:next
  - id: P16-B015
    phase: 16
    title: Close the guard asymmetries the sweep found
    milestone: GA-critical
    owner: compatibility-owner
    depends_on:
      - P16-B012
    maps_to:
      - packages/cli/src/commands/workflow/contextual.ts
      - packages/cli/src/commands/workflow/validate.ts
    acceptance:
      - >-
        mapQuery refuses to run when no codebase map exists; mapCheck treats the same condition as
        merely stale. One reports a missing prerequisite, the other reports a comparison it never
        made.
      - >-
        handleDoctorCommand computes five checks and derives ok from three. A missing
        bundles/index.json produces no diagnostic and no failure, so doctor reports healthy while
        holding the evidence that it is not.
      - >-
        checkTraceability is called without the guard resolveTraceabilityStatus applies, and the
        comment on that guard records it as a defect already fixed once on the status surface. The
        same unreadable requirement set is refused on one surface and silently treated as empty on
        two others.
      - >-
        legion map --query rejects an empty string but reports a successful search with zero results
        when every token is discarded by the tokenizer, which is the same input in a different
        costume.
    verification:
      - node --test tests/verb-defects.test.mjs
      - node --test tests/validate-traceability.test.mjs
      - pnpm run validate:next
  - id: P16-B002
    phase: 16
    title: Split validate and map across the CLI and host boundary
    milestone: GA-critical
    owner: compatibility-owner
    depends_on:
      - P16-B001
      - P16-B012
    maps_to:
      - commands/validate.md
      - commands/map.md
    acceptance:
      - >-
        Both commands were class A in the first two revisions of this item, on the grounds that
        their verbs are deterministic and executor-free. That is true and is a different claim from
        equivalence. Grounding both in their handlers moved both to class B.
      - >-
        map keeps the analytical half: the architecture narrative, dependency graph, API surface,
        coverage map, and ranked risk hotspots. legion map produces a file-extension histogram over
        {path, sha256, sizeBytes, lineCount, symbols, headings, summary} records, where symbols come
        from seven regexes. Both are called the codebase map and neither is the other. An earlier
        revision claimed they write the same filename; they do not. The command writes
        .planning/CODEBASE.md and refreshCodebaseMap writes a run-scoped
        .legion/project/workflow/map/<run>/codebase.md.
      - >-
        validate keeps the repair-then-reverify loop and the per-check fixability policy. The CLI
        gains a WARN severity before the command is thinned: the command scores every check PASS,
        WARN, or FAIL, and the verb fails on any diagnostic, so converting today would turn every
        warning into a hard CI failure.
      - >-
        legion validate gains validation of the root settings.json, with tests. It is not under
        .planning/, it has a published schema at docs/settings.schema.json, and nothing in packages/
        reads control_mode, max_tasks_per_plan, or max_cycles. It is the one capability in the
        command that outlives the directory and has no verb equivalent.
      - >-
        legion map gains a non-mutating default, four freshness states, the 30-day age rule, and
        empty-source handling.
      - >-
        Three deliberate removals are recorded before the edit, each assigned rather than implied:
        validate --fix, whose targets all retire; the agent-roster check, whose comparands in
        STATE.md and authority-matrix.yaml both retire; and validate --ci, whose one-line summary is
        already covered by --json and whose three-valued exit code has no counterpart, since success
        and failure hardcode 0 and 1. Adding WARN severity does not preserve --ci, and leaving that
        unsaid would let the command be removed while every criterion passed and CI consumers lost
        the interface.
      - >-
        P16-B012 owns the map --query --scope fix and lands first. Without that ordering this item
        could remove commands/map.md while the replacement still answered scoped queries from the
        whole repository. An earlier revision made only B003 depend on B012 and left this item
        eligible in parallel — the same defect, applied to one neighbour and not the other, which
        is the pattern the phase-C reviews already named twice.
      - Neither file reads .planning/, and both are removed from the allowlist.
      - Any state the host needs that the CLI does not expose is added to the CLI first, with tests.
    verification:
      - node --test tests/command-surface.test.mjs
      - node --test tests/legacy/installer-smoke.test.cjs
      - pnpm run validate:next
  - id: P16-B003
    phase: 16
    title: Split learn, retro, and milestone across the CLI and host boundary
    milestone: GA-critical
    owner: compatibility-owner
    depends_on:
      - P16-B001
      - P16-B012
    maps_to:
      - commands/learn.md
      - commands/retro.md
      - commands/milestone.md
    acceptance:
      - >-
        All three were class A in the first two revisions of this item. Grounding each in its
        handler moved all three to class B, for the same reason as B002: deterministic was read as
        equivalent.
      - >-
        legion learn gains a typed lesson kind, tags, and a summary on the record path first, then
        --recall and --list. LessonIndex records carry only {id, lesson, createdAt, artifactPath}.
        The kind alone is not enough: --recall scores a tag match 3, a summary match 2, and a body
        match 1, so records without tags and summaries can support body matching alone and the
        ranking silently degrades to one third of the rule.
      - >-
        --recall's corpus is decided before it is built. The command searches five memory files, and
        RETRO.md among them cross-references retrospective findings, which in v9 are run-scoped
        retro.md artifacts rather than lessons. Either the query path includes them or their
        exclusion is recorded as a deliberate removal; implementing recall over knowledge-index.json
        alone would silently stop returning retrospective findings.
      - --prune targets .planning/memory/OUTCOMES.md and is a recorded deliberate removal.
      - >-
        P16-B012 lands first and owns the two defect fixes: making retro's scope flags select
        evidence or be rejected, and making milestone status read-only. An earlier revision of this
        item claimed both while B012 also claimed them, which would have put two owners on one
        handler.
      - >-
        Building on that, legion retro puts the selected scope's evidence in front of the executor.
        This is a separate requirement from scoping the flags and is not satisfied by it: today
        guidancePrompt carries the workflow, the topic, and four section names, and nothing else.
        resolveWorkflowState().stage and the last two guidance runs are read before the run but
        consumed only by renderGuidanceMarkdown afterwards, so the model producing the findings sees
        no project evidence at all. An implementation that made --phase select those two metadata
        sources would leave the analysis exactly as unevidenced as it is now.
      - >-
        legion milestone gains a pre-flight gate on --complete requiring every phase to be complete.
        The command's stated invariant is no partial completions, and the verb checks only that the
        milestone id exists.
      - >-
        The archive relocation is a recorded deliberate removal, assigned rather than left open. The
        command moves phase directories from .planning/phases/ to .planning/archive/milestone-N/ and
        both paths retire with the directory, so there is nothing in v9 for the operation to move;
        an equivalent over .legion artifacts would be new work, not preservation. An earlier revision
        recorded only that --archive relocates nothing, which assigned the operation to no one and
        would have let every criterion pass while the behaviour simply disappeared.
      - >-
        The archive confirmation goes with it. Its text reports how many phase directories will move
        and where, so retaining it once the relocation is gone would ask the operator to approve an
        operation that no longer happens. A revision that removed the relocation while still
        requiring the host to keep this prompt left the two criteria contradicting each other. If a
        confirmation survives it is a new one about the status transition.
      - >-
        legion milestone gains summary generation from the artifacts it already owns. The command
        composes the completion summary from plan, requirement, file, agent, outcome and decision
        data; the verb stores the caller's --summary verbatim. Neither side claimed this, so
        conversion could have replaced computed milestone evidence with an operator-typed string and
        satisfied every criterion.
      - >-
        legion retro gains a non-persisting run followed by an explicit save. runRetroWorkflow writes
        retro.md and the guidance run before it returns, so the host's view-only choice still
        persists and edit-before-saving edits findings that were already recorded. Requiring
        artifacts to stay CLI-written while also retaining those choices was a contradiction between
        two criteria, not a boundary.
      - >-
        The retro-to-plan loop is preserved or its removal recorded. commands/plan.md reads the
        latest retrospective and injects its high-priority actions and agent adjustments into
        decomposition, and nothing in the repository reads retro.md. Converting retro and plan
        separately would break that loop with no criterion noticing, because it is the one capability
        here that lives between two commands rather than inside either.
      - >-
        The host keeps what has no verb: learn's classification prompt and recording loop, retro's
        cross-project mode, and milestone's phase clustering, completion commit, and GitHub milestone
        close. No git commit and no gh invocation exists anywhere in packages/cli/src.
      - Guidance artifacts continue to be written by the CLI, not by the host.
      - All three are removed from the allowlist.
    verification:
      - node --test tests/command-surface.test.mjs
      - node --test tests/workflow-guidance.test.mjs
      - pnpm run validate:next
  - id: P16-B005
    phase: 16
    title: Split plan, quick, and polish across the CLI and host boundary
    milestone: GA-critical
    owner: compatibility-owner
    depends_on:
