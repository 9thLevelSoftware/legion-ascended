  # Phase 16 retires .planning/ from the installed command surface. Phase 15 is
  # skipped: no backlog item claims it, but the control-artifacts branch used
  # the name informally, and reusing it would make two different things share a
  # number.
  #
  # commands/start.md and commands/status.md are already converted and are the
  # worked examples. The remaining sixteen are not one kind of work — see
  # P16-B001's conversion contract for the three classes and why thin-wrapping
  # the orchestration commands would delete capability silently.
  #
  # The first pass of this plan classified from one-line help text and got four
  # wrong: advise, ship, board, and explore each own orchestration no CLI verb
  # performs. Review caught the first three. The fourth, and three false claims
  # about what the verbs do, were caught only once B001's inventory was built
  # from the implementations.
  #
  # The class assignments below are no longer the record. B001 delivered
  # docs/next/command-capability-inventory.json, which is checked against the
  # code by scripts/scan-command-surface.mjs and is authoritative where the two
  # disagree. docs/next/COMMAND-CONVERSION-CONTRACT.md states the procedure.
  - id: P16-B001
    phase: 16
    title: Ratchet the command surface off .planning/
    milestone: GA-critical
    owner: compatibility-owner
    depends_on:
      - P14-B001
    maps_to:
      - commands/start.md
      - commands/status.md
    acceptance:
      - A test enumerates every commands/*.md and fails when one reads .planning/ outside a declared allowlist.
      - The allowlist is seeded with the sixteen unconverted commands and may only ever be shortened.
      - A conversion contract records, per class, what the CLI owns and what the host keeps.
      - The contract states that a command whose host-only behaviour is not inventoried before editing must not be converted.
      - >-
        A per-command capability inventory records what the markdown does and what the CLI verb
        actually does, and is completed before the command is assigned a class. Verb existence is
        not evidence of parity: explore and council resolve to one shared implementation
        (runExecutorBackedGuidance in packages/cli/src/commands/workflow/contextual.ts), as do
        quick and polish (createTypedAdHocWorkflow), so those four verb names describe two
        behaviours between them.
      - >-
        The inventory's claims are checked against the code rather than read. Every host-only
        capability carries an anchor that must still appear in the command file, every verb claim
        names a handler symbol that must still resolve, and executorBacked is recomputed from the
        handler body instead of being asserted.
      - >-
        A command on the allowlist with no inventory entry fails the ratchet, so a class cannot be
        assigned to a command nobody has looked at. That is the check the first pass lacked: it
        classified from one-line help text and put advise, ship, board, and explore in classes
        that would have deleted an advisor selection, a publishing workflow, a deliberating panel,
        and the design conversation exploration exists to hold.
    verification:
      - node --test tests/command-surface.test.mjs
      - node scripts/scan-command-surface.mjs
      - pnpm run validate:next
  - id: P16-B002
    phase: 16
    title: Split validate and map across the CLI and host boundary
    milestone: GA-critical
    owner: compatibility-owner
    depends_on:
      - P16-B001
    maps_to:
      - commands/validate.md
      - commands/map.md
    acceptance:
      - >-
        Both commands were class A in the first two revisions of this item, on the grounds that
        their verbs are deterministic and executor-free. That is true and is a different claim from
        equivalence. Grounding both in their handlers moved both to class B.
      - >-
        map keeps the analytical half: the architecture narrative, dependency graph, API surface,
        coverage map, and ranked risk hotspots. legion map produces a file-extension histogram over
        {path, sha256, sizeBytes, lineCount, symbols, headings, summary} records, where symbols come
        from seven regexes. Both write a file named CODEBASE.md and they are not the same artifact,
        which is precisely why the earlier reading passed for checked.
      - >-
        validate keeps the repair-then-reverify loop and the per-check fixability policy. The CLI
        gains a WARN severity before the command is thinned: the command scores every check PASS,
        WARN, or FAIL, and the verb fails on any diagnostic, so converting today would turn every
        warning into a hard CI failure.
      - >-
        legion validate gains validation of the root settings.json, with tests. It is not under
        .planning/, it has a published schema at docs/settings.schema.json, and nothing in packages/
        reads control_mode, max_tasks_per_plan, or max_cycles. It is the one capability in the
        command that outlives the directory and has no verb equivalent.
      - >-
        legion map gains a non-mutating default, four freshness states, the 30-day age rule, and
        empty-source handling. Deliberate removals are recorded before the edit: validate --fix and
        --prune targets that retire with .planning/, and the agent-roster check, whose comparands
        in STATE.md and authority-matrix.yaml both retire.
      - Neither file reads .planning/, and both are removed from the allowlist.
      - Any state the host needs that the CLI does not expose is added to the CLI first, with tests.
    verification:
      - node --test tests/command-surface.test.mjs
      - node --test tests/legacy/installer-smoke.test.cjs
      - pnpm run validate:next
  - id: P16-B003
    phase: 16
    title: Split learn, retro, and milestone across the CLI and host boundary
    milestone: GA-critical
    owner: compatibility-owner
    depends_on:
      - P16-B001
    maps_to:
      - commands/learn.md
      - commands/retro.md
      - commands/milestone.md
    acceptance:
      - >-
        All three were class A in the first two revisions of this item. Grounding each in its
        handler moved all three to class B, for the same reason as B002: deterministic was read as
        equivalent.
      - >-
        legion learn gains a typed lesson kind first, then --recall and --list. LessonIndex records
        carry only {id, lesson, createdAt, artifactPath}, so pattern, pitfall, and preference do not
        exist in the CLI's data model and the two modes built on them cannot be implemented over it.
        --prune targets .planning/memory/OUTCOMES.md and is a recorded deliberate removal.
      - >-
        legion retro's --phase and --milestone become real scope selectors that gather that scope's
        evidence. Today they reach a slug, a run record, and an interpolated prompt topic, and
        select nothing: the evidence set is hardcoded to the workflow stage plus the last two
        guidance runs per workflow. A flag that appears implemented and does nothing is the sharpest
        form of the parity trap this phase exists to catch.
      - >-
        legion milestone gains a read-only status query before the host renders it. Status is the
        implicit default and still rewrites milestones.json, writes milestones.md, and appends a
        guidance run on every invocation, so a thinned host would mutate project state on every
        display.
      - >-
        legion milestone gains a pre-flight gate on --complete requiring every phase to be complete.
        The command's stated invariant is no partial completions, and the verb checks only that the
        milestone id exists. --archive relocating nothing is recorded as a gap, not thinned as-is.
      - >-
        The host keeps what has no verb: learn's classification prompt and recording loop, retro's
        save-or-discard decision, edit-before-saving path, and cross-project mode, and milestone's
        phase clustering, archive confirmation, completion commit, and GitHub milestone close. No
        git commit and no gh invocation exists anywhere in packages/cli/src.
      - Guidance artifacts continue to be written by the CLI, not by the host.
      - All three are removed from the allowlist.
    verification:
      - node --test tests/command-surface.test.mjs
      - node --test tests/workflow-guidance.test.mjs
      - pnpm run validate:next
  # Found while inventorying for B002 and B003, and true of the CLI today rather
  # than of the conversion. Kept separate because they are defects a user hits
  # now, not work the conversion creates.
  - id: P16-B012
    phase: 16
    title: Fix three verb defects the capability inventory surfaced
    milestone: GA-critical
    owner: compatibility-owner
    depends_on:
      - P16-B001
    maps_to:
      - packages/cli/src/commands/workflow/contextual.ts
    acceptance:
      - >-
        legion map --query <text> --scope <path> no longer silently ignores the scope. mapQuery is
        called without it and the mode-conflict guard does not catch it, because scope is not a
        mode, so the query runs unscoped and reports success. Either scope it or reject the
        combination.
      - >-
        legion milestone with no mode no longer mutates. Status is the implicit default and rewrites
        milestones.json, writes a fresh milestones.md, and appends a guidance run on every
        invocation, so reading state changes it and pollutes the run history.
      - >-
        legion retro --phase and --milestone either select evidence or are rejected. They currently
        reach only a slug, a run record, and a prompt topic string, so a scoped retrospective
        silently produces an unscoped one.
      - Each fix carries a test that fails against the current behaviour.
    verification:
      - node --test tests/workflow-guidance.test.mjs
      - pnpm run validate:next
  - id: P16-B005
    phase: 16
    title: Split plan, quick, and polish across the CLI and host boundary
    milestone: GA-critical
    owner: compatibility-owner
    depends_on:
      - P16-B001
    maps_to:
      - commands/plan.md
      - commands/quick.md
      - commands/polish.md
    acceptance:
      - Host-only behaviour is inventoried and recorded before any file is edited.
      - The CLI owns the taskgraph, the risk classification, and the decision that planning is complete.
      - The host retains only agent selection and rendering, and reaches state through the CLI's typed artifacts.
      - No capability present before the split is absent after it, or its removal is recorded as deliberate.
    verification:
      - node --test tests/command-surface.test.mjs
      - node --test tests/workflow-command-contract.test.mjs
      - pnpm run validate:next
  - id: P16-B006
    phase: 16
    title: Split build across the CLI and host boundary
    milestone: GA-critical
    owner: compatibility-owner
    depends_on:
      - P16-B005
    maps_to:
      - commands/build.md
    acceptance:
      - >-
        Every agent-dispatch site in commands/build.md is inventoried before editing, each
        classified as host-only or CLI-owned. An earlier revision of this item asserted fourteen
        sites; no counting rule in the repository reproduces that number, so the criterion is
        coverage of the sites the inventory records, not a count nobody can recompute.
      - The CLI owns verification, diff reconciliation, and the task verdict; the host owns wave dispatch only.
      - The wave executor survives the conversion, or its removal is recorded with a replacement.
    verification:
      - node --test tests/command-surface.test.mjs
      - node --test tests/build-diff-reconciliation.test.mjs
      - node scripts/dogfood-workflow.mjs --executor fake
      - pnpm run validate:next
  - id: P16-B007
    phase: 16
    title: Split review across the CLI and host boundary
    milestone: GA-critical
    owner: compatibility-owner
    depends_on:
      - P16-B005
    maps_to:
      - commands/review.md
    acceptance:
      - >-
        Every agent-dispatch site in commands/review.md is inventoried before editing, each
        classified as host-only or CLI-owned. An earlier revision asserted sixteen sites, which no
        counting rule reproduces.
      - The CLI owns the verification report, the gate set, and human acceptance; the host owns the review panel.
      - legion review exposes what a panel needs before commands/review.md is thinned, not after.
      - The multi-agent review panel survives the conversion, or its removal is recorded with a replacement.
    verification:
      - node --test tests/command-surface.test.mjs
      - node --test tests/workflow-command-contract.test.mjs
      - pnpm run validate:next
  - id: P16-B008
    phase: 16
    title: Split ship across the CLI and host boundary
    milestone: GA-critical
    owner: compatibility-owner
    depends_on:
      - P16-B005
    maps_to:
      - commands/ship.md
    acceptance:
      - ship renders the derived gate set and never asserts readiness the CLI did not derive.
      - >-
        PR creation and pushing (commands/ship.md:152-229) and post-ship verification and canary
        monitoring (commands/ship.md:235-308) survive the split as host responsibilities.
        packages/cli/src/commands/workflow/ship.ts states that this layer does not publish or
        release, so the CLI cannot absorb them and a readiness-only rendering would delete the
        actual shipping workflow while every listed test still passed.
      - The command is removed from the allowlist.
    verification:
      - node --test tests/command-surface.test.mjs
      - node --test tests/ship-traceability.test.mjs
      - pnpm run validate:next
  - id: P16-B010
    phase: 16
    title: Split advise across the CLI and host boundary
    milestone: GA-critical
    owner: compatibility-owner
    depends_on:
      - P16-B005
    maps_to:
      - commands/advise.md
    acceptance:
      - >-
        Every agent-dispatch site in commands/advise.md is inventoried before editing. An earlier
        revision asserted three, which no counting rule reproduces.
      - >-
        Advisor selection with personality injection (commands/advise.md:56-146) and the follow-up
        session (commands/advise.md:157-181) survive as host responsibilities. legion advise runs
        one executor pass against fixed sections and supports no second turn, so thinning to a JSON
        renderer would replace a chosen specialist and a multi-turn consultation with a single
        generic artifact. An earlier revision called the verb a generic guidance executor; it is
        purpose-built (runAdviceWorkflow), which does not change the conclusion but was not checked.
      - The advisory agent remains read-only, as the current dispatch specification requires.
      - The command is removed from the allowlist.
    verification:
      - node --test tests/command-surface.test.mjs
      - node --test tests/workflow-guidance.test.mjs
      - pnpm run validate:next
  - id: P16-B011
    phase: 16
    title: Split board across the CLI and host boundary, keeping its panel
    milestone: GA-critical
    owner: compatibility-owner
    depends_on:
      - P16-B005
    maps_to:
      - commands/board.md
    acceptance:
      - >-
        The user-facing /legion:board name is preserved. Preserving the name is necessary and not
        sufficient: the defining behaviour is the panel, not the label.
      - >-
        The user-confirmed slate and the 3-5 independent assessments with quorum semantics
        (commands/board.md:67-129), and the vote tally and tie resolution
        (commands/board.md:139-202), survive as host responsibilities. legion council invokes one
        generic guidance executor, so driving the verb alone would collapse a deliberating panel
        into a single opinion.
      - The CLI owns the recorded decision artifact; the host owns composition, deliberation, and tallying.
      - The command is removed from the allowlist.
    verification:
      - node --test tests/command-surface.test.mjs
      - node --test tests/workflow-guidance.test.mjs
      - pnpm run validate:next
  - id: P16-B004
    phase: 16
    title: Split explore across the CLI and host boundary
    milestone: GA-critical
    owner: compatibility-owner
    depends_on:
      - P16-B005
    maps_to:
      - commands/explore.md
    acceptance:
      - The CLI owns the typed exploration artifact and its exploratory status; the host owns the design conversation.
      - >-
        The entry-path choice, the bounded research pass, the iterative clarifying interview over
        eight named decisions, and the two-to-three approach comparison with its choose, refine, or
        keep-comparing loop all survive as host responsibilities. legion explore runs one executor
        pass against fixed sections and shares that implementation with legion council, so
        rendering its payload would replace the whole conversation with a single artifact.
      - >-
        This item previously classified explore as a thin renderer. That was the fourth
        misclassification of the first pass and the one review did not catch. It is also the least
        safe: the governing plan makes exploration the one step where wide latitude is correct,
        because nothing it produces is authoritative.
      - explore continues to produce an exploration typed as exploratory that start can seed proposals from.
      - The command is removed from the allowlist.
    verification:
      - node --test tests/command-surface.test.mjs
      - node --test tests/workflow-guidance.test.mjs
      - pnpm run validate:next
  - id: P16-B009
    phase: 16
    title: Decide where agent and portfolio belong
    milestone: GA-critical
    owner: compatibility-owner
    depends_on:
      - P16-B001
    maps_to:
      - commands/agent.md
      - commands/portfolio.md
    acceptance:
      - A recorded decision states, for each command, whether it gains a CLI verb or stays host-owned.
      - The decision addresses that portfolio is cross-repo while every CLI verb is scoped by --repository-root, so a repo-scoped CLI may have no valid home for it.
      - The decision addresses that agent authors personality files rather than workflow state, and so may not be a workflow verb at all.
      - Whatever is decided, neither file reads .planning/ afterwards, and both leave the allowlist.
    verification:
      - node --test tests/command-surface.test.mjs
      - pnpm run validate:next
