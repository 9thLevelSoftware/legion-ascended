      - node --test tests/workflow-command-contract.test.mjs
      - pnpm run validate:next
  - id: P16-B008
    phase: 16
    title: Split ship across the CLI and host boundary
    milestone: GA-critical
    owner: compatibility-owner
    depends_on:
      - P16-B005
    maps_to:
